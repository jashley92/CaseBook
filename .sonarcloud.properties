# SonarCloud automatic analysis settings.

# The SQL Server schema script is generated from the EF Core migrations (dotnet ef migrations script), so
# findings in it can't be fixed by hand; its FOREIGN KEY ... ON DELETE NO ACTION clauses also trip the
# "DELETE without WHERE" rule. Hand-written SQL under deploy/sql stays analysed.
sonar.exclusions=deploy/sql/casebook-schema-sqlserver.sql
