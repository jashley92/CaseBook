name: CI

# Skip runs for documentation-only changes to conserve Actions minutes.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  # BUG-318: the release workflow runs these same jobs on the tagged commit and publishes only if they pass.
  workflow_call:

# Only keep the latest run per ref; cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Linux runner (1x Actions-minute rate). PDF report generation bundles its own fonts via
    # EmbeddedFontResolver, so it no longer depends on OS-installed fonts and passes here.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # SonarQube Cloud CI-based analysis wraps the build and test below. Every Sonar step is skipped when the
      # secret is absent (fork PRs), so the build itself never depends on it. The scanner needs Java 17+,
      # which ubuntu-latest ships.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # release tags, for the released-migrations check

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Cache SonarQube Cloud packages
        if: env.SONAR_TOKEN != '' && !startsWith(github.ref, 'refs/tags/')   # analysis is for main and PRs, not tags
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}
          restore-keys: sonar-${{ runner.os }}

      - name: Restore
        id: restore
        run: |
          dotnet restore
          dotnet tool restore

      # The generated SQL Server schema script comes from the EF Core migrations (dotnet ef migrations script),
      # so findings in it can't be fixed by hand; its FOREIGN KEY ... ON DELETE NO ACTION clauses also trip the
      # "DELETE without WHERE" rule. Hand-written SQL under deploy/sql stays analysed. EF migrations are generated
      # too: they stay analysed for issues but don't count toward coverage (CI proves them by applying them) or
      # duplication (each schema change is generated as a near-identical SQLite / SQL Server pair by design).
      # Razor components (the .razor markup and their C# partials and helpers under Components/) are left out of
      # coverage too: there are no component tests, so the 80% new-code bar
      # applies to the C# services and domain, where the logic lives and the tests are. Likewise the deploy
      # PowerShell, browser JS and the XSIAM Python integration: no coverage tooling runs for them, so Sonar
      # would count every line as uncovered. All of them are still analysed for issues.
      # BUG-466: sonar.qualitygate.wait makes the end step wait for the server's verdict and fail on a red gate, so a
      # failing gate fails CI on main and PRs (it used to pass, and the release then shipped it).
      # BUG-495: xml:S5734 wants X-Content-Type-Options set in web.config; SecurityHeadersMiddleware sends it on every
      # response (Kestrel and IIS alike), and setting it in IIS too would send the header twice.
      # csharpsquid:S5332 wants EnableSsl = true on the SmtpClient; SmtpClientFactory sets it from Email:EnableSsl, which
      # defaults to on (S4423) and is turned off only for a relay that does its own TLS. TLS is managed by that setting.
      # BUG-657: the waiver covers that one small file, so the rest of the mail code is still checked for S5332.
      # csharpsquid:S3011 (reflection past accessibility) in TrailSnapshot: the integrity check rebuilds a record as its
      # audit trail recorded it, and the domain's value setters are private by design; it only copies CaseBook's own
      # entities in-process and never touches anything a caller supplies.
      - name: SonarQube Cloud analysis (begin)
        if: env.SONAR_TOKEN != '' && !startsWith(github.ref, 'refs/tags/')   # analysis is for main and PRs, not tags
        run: >-
          dotnet sonarscanner begin /k:"jashley92_CaseBook" /o:"jashley92" /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.qualitygate.wait=true /d:sonar.qualitygate.timeout=600
          /d:sonar.cs.opencover.reportsPaths="tests/**/TestResults/*/coverage.opencover.xml"
          /d:sonar.exclusions="deploy/sql/casebook-schema-sqlserver.sql"
          /d:sonar.cpd.exclusions="src/IncidentManager.Migrations.SqlServer/Migrations/**,src/IncidentManager.Infrastructure/Persistence/Migrations/**"
          /d:sonar.coverage.exclusions="src/IncidentManager.Migrations.SqlServer/Migrations/**,src/IncidentManager.Infrastructure/Persistence/Migrations/**,**/*.razor,src/IncidentManager.Web/Components/**,**/*.ps1,**/*.psm1,**/*.js,**/*.mjs,**/*.py"
          /d:sonar.issue.ignore.multicriteria=hdr,smtp,refl
          /d:sonar.issue.ignore.multicriteria.hdr.ruleKey="xml:S5734"
          /d:sonar.issue.ignore.multicriteria.hdr.resourceKey="**/web.config"
          /d:sonar.issue.ignore.multicriteria.smtp.ruleKey="csharpsquid:S5332"
          /d:sonar.issue.ignore.multicriteria.smtp.resourceKey="**/Notifications/SmtpClientFactory.cs"
          /d:sonar.issue.ignore.multicriteria.refl.ruleKey="csharpsquid:S3011"
          /d:sonar.issue.ignore.multicriteria.refl.resourceKey="**/Integrity/TrailSnapshot.cs"

      - name: Build
        id: build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: >-
          dotnet test --no-build -c Release --verbosity minimal
          --collect "XPlat Code Coverage;Format=opencover"

      - name: SonarQube Cloud analysis (end)
        if: env.SONAR_TOKEN != '' && !startsWith(github.ref, 'refs/tags/')   # analysis is for main and PRs, not tags
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # Upgrade safety (see docs/UPGRADE.md). A migration that shipped in a release must never be edited,
      # removed, or regenerated — databases from that release would stop upgrading. And the model must not
      # drift from the migrations: EF refuses to Migrate() with un-migrated model changes, so the app would
      # fail to start on upgrade.
      # BUG-466: these gates don't depend on Sonar or the tests, so they still run when the Sonar end step (a red gate,
      # a SonarQube Cloud outage) or a test fails, rather than hiding behind it. The job fails either way.
      - name: Released migrations are immutable
        if: ${{ !cancelled() }}
        run: bash tools/ci/check-migrations-immutable.sh

      - name: No un-migrated model changes (SQL Server + SQLite)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          IM_MIGRATIONS_PROVIDER=SqlServer dotnet ef migrations has-pending-model-changes --no-build --configuration Release             --project src/IncidentManager.Migrations.SqlServer --startup-project src/IncidentManager.Web --context AppDbContext
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release             --project src/IncidentManager.Infrastructure --startup-project src/IncidentManager.Web --context AppDbContext

      # H-05: fail the build on any known-vulnerable NuGet package (direct or transitive), so a
      # supply-chain advisory can't land silently. Deprecated packages are reported but not fatal.
      # REV-78: shell: bash runs with pipefail, so a scan that fails (the vulnerability data unreachable, say) fails the
      # step instead of piping its error through tee into "No vulnerable packages".
      - name: Vulnerable package scan (H-05)
        if: ${{ !cancelled() && steps.restore.outcome == 'success' }}
        shell: bash
        run: |
          echo "Scanning for vulnerable packages (including transitive)…"
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vulnerable.log
          if grep -q "has the following vulnerable packages" vulnerable.log; then
            echo "::error::Vulnerable NuGet packages detected — see the scan output above."
            exit 1
          fi
          echo "No vulnerable packages."

      - name: Deprecated package report (informational)
        if: always()
        run: dotnet list package --deprecated 2>&1 | tee deprecated.log || true

  # Real upgrade test on SQL Server 2022: install each recent release into a fresh database (migrate + seed
  # demo cases), then start THIS build against the same database and require it to upgrade in place with
  # every case and audit row intact. Catches lineage breaks, migrations that fail on existing data, and
  # startup seeders that break on a populated database — before a release ships.
  upgrade-path:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SA_PASSWORD: Upg!${{ github.run_id }}x   # throwaway container; not a secret
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Upg!${{ github.run_id }}x
        ports: [ '1433:1433' ]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Upg!${{ github.run_id }}x' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # release tags to upgrade from

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Tests that need production's database engine, skipped in the SQLite run above: [SqlServerFact] tests (e.g. the
      # F-08 dashboard queries whose elapsed-time math becomes DATEDIFF_BIG) and the SqlServer rows of TestDatabase theories.
      - name: SQL Server tests
        env:
          CASEBOOK_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False
        run: dotnet test tests/IncidentManager.IntegrationTests -c Release --filter "DisplayName~SqlServer" --verbosity minimal

      # BUG-133: the DBA schema script (DbaApplies installs) must match the migrations and apply on an empty database
      # and again on one it already built. Regenerate it with tools/schema/sqlserver-script.sh.
      - name: DBA schema script is current and re-runnable
        env:
          SA: ${{ env.SA_PASSWORD }}
          MSSQL: ${{ job.services.mssql.id }}
        run: |
          dotnet tool restore
          bash tools/schema/sqlserver-script.sh "$RUNNER_TEMP/schema.sql"
          # Apart from the EF Core version stamped on each history row (a new EF patch changes it, not the schema); the
          # script prints what else differs.
          if ! python3 tools/schema/same_schema.py < "$RUNNER_TEMP/schema.sql"; then
            echo "::error::deploy/sql/casebook-schema-sqlserver.sql is out of date. Run: bash tools/schema/sqlserver-script.sh"
            exit 1
          fi
          docker cp deploy/sql/casebook-schema-sqlserver.sql "$MSSQL:/tmp/schema.sql"
          q() { docker exec "$MSSQL" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA" -b -I "$@"; }
          q -Q "CREATE DATABASE SchemaScript"
          q -d SchemaScript -i /tmp/schema.sql > /dev/null
          q -d SchemaScript -i /tmp/schema.sql > /dev/null
          q -Q "DROP DATABASE SchemaScript"

      - name: Upgrade from recent releases and the first release
        env:
          CASEBOOK_TEST_SQL: Server=localhost,1433;User Id=sa;Password=${{ env.SA_PASSWORD }};TrustServerCertificate=True;Encrypt=False
          SQLCMD: docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P ${{ env.SA_PASSWORD }}
        run: |
          # The three newest releases reachable from this commit, plus the first release: installs upgrade
          # straight from whatever they run (a v1.0.0 site went to v1.2.3 in one step), so the oldest jump is tested too.
          tags="$( { git tag --list 'v[0-9]*' --merged HEAD --sort=-v:refname | head -3
                     git tag --list 'v[0-9]*' --merged HEAD --sort=v:refname | head -1; } | sort -u -V -r)"
          if [ -z "$tags" ]; then echo "No release tags yet; nothing to upgrade from."; exit 0; fi
          for tag in $tags; do
            [ "$(git rev-parse "$tag^{commit}")" = "$(git rev-parse HEAD)" ] && continue
            bash tools/upgrade-test/upgrade-path.sh "$tag"
          done

  # NOTE: CodeQL static analysis runs via GitHub's managed **default setup** (Settings → Code security),
  # not a workflow here — the two can't coexist (an advanced workflow's SARIF upload is rejected while
  # default setup is enabled). Default setup covers C# + JavaScript/TypeScript + Actions on the
  # 'extended' (security-and-quality) query suite. The .NET analyzers still run on every build above
  # (AnalysisLevel=latest-recommended in Directory.Build.props), and the vulnerable-package gate is
  # unconditional.
