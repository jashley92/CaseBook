name: Release

# Build a deployable bundle and publish it as a GitHub Release whenever a version
# tag (v*) is pushed, e.g. `git tag v2.4.0 && git push origin v2.4.0`.
# The bundle is what deploy/Upgrade-CaseBook.ps1 consumes, so ops upgrades never
# need the .NET SDK or NuGet access on the server.
on:
  push:
    tags: [ 'v*' ]

# Only keep the latest run per tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # BUG-318 (REV-77): every CI gate on the tagged commit itself, the SQL Server ones included (the SQL Server tests, the
  # DBA schema script being current and re-runnable, the upgrade from earlier releases) and the vulnerable-package scan.
  # A tag can sit on a commit CI never ran (a docs-only commit skips it) or one whose CI failed; the bundle carries the DBA
  # script, so a stale one would leave DbaApplies sites unable to start. Sonar is the exception: see the release job.
  gates:
    uses: ./.github/workflows/ci.yml
    secrets: inherit
    permissions:
      contents: read

  release:
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # earlier release tags, for the released-migrations check

      # BUG-466: the gates job above skips Sonar (analysis is for main and PRs, not tags), so ask SonarQube Cloud for the
      # quality gate of the analysis CI on main made of this commit, and refuse to release unless it passed. It waits up
      # to 15 minutes for main's CI to finish the analysis. Without SONAR_TOKEN (forks) it warns and skips.
      - name: SonarQube Cloud quality gate passed on main
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: bash tools/ci/check-sonar-quality-gate.sh "$GITHUB_SHA"

      # Refuse to ship a release that edits/removes a migration an earlier release shipped — databases
      # installed from that release could not upgrade to this one (docs/UPGRADE.md).
      - name: Released migrations are immutable
        run: bash tools/ci/check-migrations-immutable.sh

      # PROD-49: the release body is the version's docs/UPGRADE.md section (the app shows it to administrators as the
      # release's notes). Checked first, so a tag without notes fails before anything is built.
      - name: Release notes from docs/UPGRADE.md
        run: |
          set -euo pipefail
          bash tools/ci/extract-release-notes.sh "${GITHUB_REF_NAME}" > release-notes.md
          prev="$(git tag --list 'v[0-9]*' --sort=-v:refname --merged HEAD | grep -vx "${GITHUB_REF_NAME}" | head -n1 || true)"
          if [[ -n "$prev" ]]; then
            printf '\n**Full changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> release-notes.md
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: |
          dotnet restore
          dotnet tool restore

      # REV-77: the same gates as CI, on the tagged commit itself. A tag can sit on a commit CI never ran (a docs-only
      # commit skips CI) or one whose CI failed, and a bundle with un-migrated model changes fails to start on upgrade.
      # PROD-49: stamp the tag's version into the assemblies (they'd otherwise all read 1.0.0), so the app knows which
      # release it is and the update check has something to compare. The SDK appends the commit (+sha) itself.
      - name: Build
        run: dotnet build --no-restore -c Release -p:Version="${GITHUB_REF_NAME#v}"

      - name: Test
        run: dotnet test --no-build -c Release --verbosity minimal

      - name: No un-migrated model changes (SQL Server + SQLite)
        run: |
          IM_MIGRATIONS_PROVIDER=SqlServer dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
            --project src/IncidentManager.Migrations.SqlServer --startup-project src/IncidentManager.Web --context AppDbContext
          dotnet ef migrations has-pending-model-changes --no-build --configuration Release \
            --project src/IncidentManager.Infrastructure --startup-project src/IncidentManager.Web --context AppDbContext

      # Framework-dependent, portable publish (no RID) — the same shape Install-CaseBook.ps1
      # produces, so the app runs under IIS in-process with the .NET 10 Hosting Bundle.
      - name: Publish web app
        run: dotnet publish src/IncidentManager.Web -c Release -o publish/app --nologo -p:Version="${GITHUB_REF_NAME#v}"

      # PROD-57: casebook-keytool (key shares, recovery drills, recovery, decrypted export), shipped under deploy/keytool.
      - name: Publish keytool
        run: dotnet publish src/IncidentManager.KeyTool -c Release -o publish/keytool --nologo -p:Version="${GITHUB_REF_NAME#v}"

      - name: Assemble release bundle
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          root="bundle/casebook-${version}"
          mkdir -p "$root"
          cp -r publish/app "$root/app"
          cp -r deploy "$root/deploy"
          cp -r publish/keytool "$root/deploy/keytool"
          # Migration-ID manifest — Upgrade-CaseBook.ps1 compares this against the target DB's
          # __EFMigrationsHistory to detect a lineage mismatch BEFORE it deploys (the failure mode
          # that crashes the app on startup when an old DB meets a newer migration set).
          ls src/IncidentManager.Migrations.SqlServer/Migrations \
            | grep -E '^[0-9]+_.*\.cs$' | grep -v '\.Designer\.cs$' \
            | sed 's/\.cs$//' | sort > "$root/migrations-sqlserver.txt"
          printf 'Version: %s\nCommit:  %s\nBuilt:   %s\n' \
            "$version" "$GITHUB_SHA" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$root/VERSION.txt"
          ( cd bundle && zip -qr "casebook-${version}.zip" "casebook-${version}" \
            && sha256sum "casebook-${version}.zip" > "casebook-${version}.zip.sha256" )

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          gh release create "$version" \
            "bundle/casebook-${version}.zip" \
            "bundle/casebook-${version}.zip.sha256" \
            --title "CaseBook ${version}" \
            --notes-file release-notes.md
