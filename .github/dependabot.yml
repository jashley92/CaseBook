# Dependabot keeps the SHA-pinned GitHub Actions current. Because each `uses:` is pinned to a full
# commit SHA with the release in a trailing comment (e.g. `@11d5960… # v4.4.0`), Dependabot bumps both
# the SHA and the comment together — so pinning stays immutable without going stale on security patches.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # One grouped PR per run instead of one per action, to keep the noise down.
    groups:
      github-actions:
        patterns:
          - "*"

  # NuGet packages across the solution. Complements the CI vulnerable-package gate (H-05): that fails a
  # build when something is already vulnerable; this proactively PRs upgrades before it comes to that.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    # Low-risk minor/patch bumps arrive as one grouped PR; majors come individually so their
    # potential breaking changes get reviewed on their own.
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
